name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: make check PYTHON=python
      - run: make check-security PYTHON=python
      - name: Build only after both gates succeed
        run: make image PYTHON=python
        env:
          SOURCE_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-provenance-${{ github.sha }}
          path: |
            reports/lesson10/build.json
            reports/lesson10/image.tar
